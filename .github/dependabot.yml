# Keeps the actions, the Go modules and the base images up to date.
# Go and Docker updates change backend/, so merging one releases a new backend
# (release-backend.yml watches backend/ and terraform/backend/); an action update
# changes workflow files only and releases nothing.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
