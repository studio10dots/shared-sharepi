name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      # The release job builds this image; make sure it still builds on every change.
      - run: docker build -t chamagon-backend:ci .

  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform fmt -check -recursive terraform/backend
      - working-directory: terraform/backend
        run: |
          terraform init -backend=false -input=false
          terraform validate

  # The scripts an owner runs in Cloud Shell. They are tested here without
  # Google or HashiCorp: the tests replace curl, uname and gcloud's answers.
  scripts:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: terraform/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash -n setup.sh ensure_terraform.sh google_user_id.sh region.sh
      - run: bash ensure_terraform_test.sh
      - run: bash google_user_id_test.sh
