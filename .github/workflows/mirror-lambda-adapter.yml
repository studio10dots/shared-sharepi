name: Mirror the Lambda adapter

# Copies AWS's Lambda Web Adapter image (public.ecr.aws/awsguru/aws-lambda-adapter)
# to ghcr.io/<owner>/aws-lambda-adapter, so building the backend's `aws` image target
# does not depend on public.ecr.aws, which refuses anonymous pulls once a shared IP is
# over its data limit (429 "Data limit exceeded"; common on GitHub's runners).
#
# Run it by hand (Actions -> Mirror the Lambda adapter) when the adapter version in
# backend/Dockerfile changes. The copy keeps every platform and the same digests as the
# original, and the job fails if the digests differ. After the first run, make the
# package public once (Packages -> aws-lambda-adapter -> Package settings -> Change
# visibility), like chamagon-backend, so nobody needs to sign in to pull it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Adapter version to copy, e.g. 0.9.1"
        required: true
        default: "0.9.1"

permissions:
  contents: read
  packages: write # pushes the copy

jobs:
  mirror:
    runs-on: ubuntu-24.04
    env:
      SRC: public.ecr.aws/awsguru/aws-lambda-adapter
      DST: ghcr.io/${{ github.repository_owner }}/aws-lambda-adapter
      VERSION: ${{ inputs.version }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reading from public.ecr.aws can itself be rate limited, so try a few times.
      - name: Copy all platforms
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad version: $VERSION"; exit 1; }
          ok=""
          for i in 1 2 3 4 5; do
            if docker buildx imagetools create --tag "$DST:$VERSION" "$SRC:$VERSION"; then ok=1; break; fi
            echo "attempt $i failed; waiting"
            sleep $((i * 30))
          done
          [ -n "$ok" ] || { echo "could not copy $SRC:$VERSION"; exit 1; }

      - name: Check that the copy is the same image
        run: |
          src="$(docker buildx imagetools inspect "$SRC:$VERSION" --format '{{.Manifest.Digest}}')"
          dst="$(docker buildx imagetools inspect "$DST:$VERSION" --format '{{.Manifest.Digest}}')"
          echo "source $src"
          echo "copy   $dst"
          [ "$src" = "$dst" ] || { echo "the digests differ"; exit 1; }
          echo "Pin it in backend/Dockerfile as $DST:$VERSION@$dst" >> "$GITHUB_STEP_SUMMARY"
